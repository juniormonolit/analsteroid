<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Мастер-иконка PWA (задача 2764) — тот же знак «Монолитика» («М-барчарт»),
       что в app/icon.svg (фавикон) и components/ui/BrandLogo.tsx: три
       вертикальных pill-столбика, крайние высокие, средний ниже, цвета стадий
       сделок (продажи/отказы/отгрузки). Масштаб ×9 от исходной геометрии
       32×32 (app/icon.svg), центрирован в safe-zone maskable-иконки — контент
       укладывается в круг диаметром ~360px (70% от 512), с большим запасом
       относительно рекомендуемых 80%, чтобы не обрезаться на любом лаунчере
       (круглые/squircle/квадратные маски Android, iOS сам скругляет углы).
       Белый фон на весь квадрат — при обрезке по маске не должно быть видно
       прозрачных краёв. Регенерация — scripts/generate-pwa-icons.mjs. -->
  <rect width="512" height="512" fill="#ffffff"/>
  <rect x="112" y="157" width="72" height="198" rx="36" fill="#3b82f6"/>
  <rect x="220" y="238" width="72" height="117" rx="36" fill="#ef4444"/>
  <rect x="328" y="157" width="72" height="198" rx="36" fill="#22c55e"/>
</svg>
